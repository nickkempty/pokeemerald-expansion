name: Fetch EmulatorJS mGBA core
on:
  push:
    branches: [webplayer-fetch]
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Download npm packages
        run: |
          mkdir -p /tmp/o && cd /tmp/o
          npm pack @emulatorjs/core-mgba@latest @emulatorjs/emulatorjs@latest @emulatorjs/core-melonds@latest @emulatorjs/core-desmume2015@latest
          for f in *.tgz; do mkdir -p "${f%.tgz}" && tar -xzf "$f" -C "${f%.tgz}"; done
          rm -f *.tgz
          find . -type f | head -100 > files.txt
          du -sh * >> files.txt
      - name: Push to webplayer-assets branch
        run: |
          cd /tmp/o && git init -q && git checkout -q -b webplayer-assets
          git -c user.name=ci -c user.email=ci@localhost add . && git -c user.name=ci -c user.email=ci@localhost commit -qm assets
          git push -qf "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" webplayer-assets
