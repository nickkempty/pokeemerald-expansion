name: Zumo ROM Build

on:
  push:
    branches:
      - zumo-hoenn-kanto
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-rom:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends binutils-arm-none-eabi gcc-arm-none-eabi libnewlib-arm-none-eabi libpng-dev python3

      - name: Build ROM
        run: make -j$(nproc) -O 2>&1 | tee build.log; exit ${PIPESTATUS[0]}

      - name: Save build log to ci-logs branch (readable by Claude via git)
        if: always()
        run: |
          mkdir -p /tmp/ci && cp build.log /tmp/ci/build.log
          { echo "run=${{ github.run_number }} sha=${{ github.sha }}"; ls -l pokeemerald.gba 2>&1; grep -E "error|Error|undefined reference|overflow" build.log | head -200; } > /tmp/ci/summary.txt
          cd /tmp/ci && git init -q && git checkout -q -b ci-logs
          git -c user.name=ci -c user.email=ci@localhost add . && git -c user.name=ci -c user.email=ci@localhost commit -qm "build ${{ github.run_number }}"
          git push -qf "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" ci-logs

      - name: Upload ROM
        uses: actions/upload-artifact@v4
        with:
          name: zumo-rom-${{ github.run_number }}
          path: pokeemerald.gba

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-${{ github.run_number }}
          path: build.log

      - name: Publish release (easy phone download)
        run: |
          cp pokeemerald.gba zumo-emerald-build${{ github.run_number }}.gba
          gh release create "build-${{ github.run_number }}" "zumo-emerald-build${{ github.run_number }}.gba" \
            --target "${{ github.sha }}" --prerelease \
            --title "Zumo Emerald build ${{ github.run_number }}" \
            --notes "Auto build from commit ${{ github.sha }}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
